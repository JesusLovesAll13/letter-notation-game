<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Notation Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Letter Notation Game</h1>
        
        <div class="stats-panel">
            <div class="stat-box">
                <label>Current Value:</label>
                <div id="currentValue" class="value-display">a</div>
            </div>
            
            <div class="stat-box">
                <label>Numeric Value:</label>
                <div id="numericValue" class="value-display">1</div>
            </div>
            
            <div class="stat-box">
                <label>Rate (per second):</label>
                <div id="rateDisplay" class="value-display">1/s</div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="control-group">
                <label for="rateInput">Set Increment Rate (per second):</label>
                <input type="number" id="rateInput" min="0.1" step="0.1" value="1">
                <button id="setRateBtn">Update Rate</button>
            </div>

            <div class="control-group">
                <button id="resetBtn" class="danger-btn">Reset to 'a'</button>
            </div>
        </div>

        <div class="info-panel">
            <h2>Notation System:</h2>
            <ul>
                <li><strong>a-z</strong> = 1-26</li>
                <li><strong>A-Z</strong> = 27-52</li>
                <li><strong>aa-zz</strong> = 53-677</li>
                <li><strong>AA-ZZ</strong> = 678-1,355</li>
                <li><strong>aaa-zzz</strong> = 1,356-18,278</li>
                <li>And so on...</li>
            </ul>
        </div>

        <div class="milestone-panel">
            <h2>Milestones:</h2>
            <div id="milestonesList" class="milestones-list">
                <div class="milestone">Next: <span id="nextMilestone">z (26)</span></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/break_eternity.js"></script>
    <script src="game.js"></script>
</body>
</html>
